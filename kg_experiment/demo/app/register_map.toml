# The demo's reading of the gate's 36 keys onto the IEAM register: which register nodes each
# key concerns. Hand-authored, like views.SYSTEMIC is the demo's reading of the record's §6; the
# register itself carries no such map, and the kit files are the evidence each row rests on.
# A row names the register nodes a change to the key would touch, the kit anchor (the same
# path#section the register's own source pointers and link evidence use), and a short note.
# Nothing here is written back to the register; the box the page draws from it says "the
# demo's reading" and its approval below is the maintainer's, not the register's.

[map]
basis = "authored"
author = "the demo session, drafted 2026-10-30"
status = "draft"            # "approved" once the maintainer has read it; the page shows the status
approved_by = ""
approved_on = ""
register_commit = "ef7fe0e114128ce0d76694fb2f95e0373ab18d2e"
keys_expected = 36

