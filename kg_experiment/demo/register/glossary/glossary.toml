# One approved term per concept. The checker refuses a forbidden synonym in any node name,
# link rationale or decision record. Modelled on pumllint's kg_experiment/demo/GLOSSARY.md.

[[term]]
term = "node"
meaning = "One record of one taxonomy: a capability, product, journey element, process element, application element, information element or organisation unit."
forbidden = ["object", "item", "element record"]
owner = "ORG-0002"
since = 2026-10-30

[[term]]
term = "link"
meaning = "One typed, directed relationship instance between two nodes, with its own id, state, owner and approval."
forbidden = ["connection", "mapping row", "edge record"]
owner = "ORG-0002"
since = 2026-10-30

[[term]]
term = "relationship type"
meaning = "One of the register's typed relationships: requires, concerns, is_supported_by, realizes, delivers, supports, crud, manages, owns, maps_to."
forbidden = ["link type", "connection type"]
owner = "ORG-0002"
since = 2026-10-30

[[term]]
term = "source of record"
meaning = "The system that authors a node's content: ARIS, Archi, the EDM repository, or the kit in this test case."
forbidden = ["master", "golden source", "system of truth"]
owner = "ORG-0002"
since = 2026-10-30

[[term]]
term = "export"
meaning = "A dated, append-only mirror of a source of record with a manifest of digests and a reconciliation report."
forbidden = ["dump", "snapshot", "extract"]
owner = "ORG-0002"
since = 2026-10-30

[[term]]
term = "approval"
meaning = "A recorded file-state change: who approved, on what date, and which decision record says why."
forbidden = ["sign-off", "signoff", "ok"]
owner = "ORG-0002"
since = 2026-10-30

[[term]]
term = "exception"
meaning = "An approved, expiring deviation from a coverage rule, with its scope and rationale."
forbidden = ["waiver", "exemption"]
owner = "ORG-0002"
since = 2026-10-30

[[term]]
term = "coverage rule"
meaning = "A check that an approved node of one kind has a link of one type, or an unexpired exception."
forbidden = ["completeness rule", "mandatory mapping"]
owner = "ORG-0002"
since = 2026-10-30
