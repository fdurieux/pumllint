# The metamodel: node kinds per taxonomy, their id prefix, the kinds a parent may have,
# and the fields every node file must carry. Levels are the IEAM's illustrative ones;
# a taxonomy may use fewer. Hierarchy is the `parent` field, never the folder.

[taxonomy.capabilities]
prefix = "CAP"
kinds = ["capability_domain", "capability", "sub_capability"]
parent_of = { capability_domain = [], capability = ["capability_domain"], sub_capability = ["capability"] }

[taxonomy.products]
prefix = "PRD"
kinds = ["portfolio", "family", "product", "variant"]
parent_of = { portfolio = [], family = ["portfolio"], product = ["family", "portfolio"], variant = ["product"] }

[taxonomy.journeys]
prefix = "JRN"
kinds = ["journey_family", "journey", "stage", "step", "touchpoint"]
parent_of = { journey_family = [], journey = ["journey_family"], stage = ["journey"], step = ["stage", "journey"], touchpoint = ["step"] }

[taxonomy.processes]
prefix = "PROC"
kinds = ["process_domain", "end_to_end_process", "subprocess", "activity"]
parent_of = { process_domain = [], end_to_end_process = ["process_domain"], subprocess = ["end_to_end_process"], activity = ["subprocess", "end_to_end_process"] }

[taxonomy.applications]
prefix = "APP"
kinds = ["application_portfolio", "application", "module"]
parent_of = { application_portfolio = [], application = ["application_portfolio"], module = ["application"] }

[taxonomy.information]
prefix = "ENT"
kinds = ["information_domain", "business_entity", "logical_entity", "attribute"]
parent_of = { information_domain = [], business_entity = ["information_domain"], logical_entity = ["business_entity"], attribute = ["logical_entity"] }

[taxonomy.organisation]
prefix = "ORG"
kinds = ["business_unit", "team"]
parent_of = { business_unit = [], team = ["business_unit"] }

[node]
required = ["id", "kind", "name", "state", "owner"]
required_when_approved = ["review_due", "approval"]
approval_fields = ["by", "on", "record"]

[relationship]
prefix = "REL"
required = ["id", "source", "target", "state", "rationale", "owner"]
required_when_approved = ["review_due", "approval"]
