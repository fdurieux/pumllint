[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jef-data-rc"
version = "0.6.0"
description = "EOD data layer: universe, collectors, Parquet store, status and the seam export"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.4.6",
    "requests==2.34.2",
    "pyarrow==25.0.1",
]

[project.scripts]
jef-data-rc = "jef_data_rc.cli:main"

[tool.setuptools]
packages = ["jef_data_rc", "jef_data_rc.collectors"]

[tool.setuptools.package-data]
jef_data_rc = ["universe.toml", "classifications.toml"]
