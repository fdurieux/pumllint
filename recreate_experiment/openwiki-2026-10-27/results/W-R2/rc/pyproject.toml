[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jef-data-rc"
version = "0.1.0"
description = "EOD acquisition, local store, adjustment and health subsystem (recreation)"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
]

[project.scripts]
jef-data-rc = "jef_data_rc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jef_data_rc*"]

[tool.setuptools.package-data]
jef_data_rc = ["universe.toml", "classifications.toml"]
