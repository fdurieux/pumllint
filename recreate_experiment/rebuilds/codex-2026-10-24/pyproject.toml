[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jef"
version = "0.6.0"
requires-python = ">=3.11"
dependencies = ["pandas==3.0.5", "numpy==2.4.6", "requests==2.34.2", "pyarrow==25.0.1"]

[project.scripts]
jef-data = "jef.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jef.data" = ["*.toml"]
