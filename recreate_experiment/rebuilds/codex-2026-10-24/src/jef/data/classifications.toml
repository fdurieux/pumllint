# /search/ endpoint. Do not hand-edit: a re-record overwrites it,
# and the point of the file is that every value came from the
# vendor rather than from us. To change a value, re-record.
#
# It is EVIDENCE, never configuration. Nothing here decides
# anything: `universe.toml`'s asset_class remains the single
# source of truth for the end-guard, the price basis, the trading
# calendar and the stored asset_type. This file can only DISAGREE
# with that declaration, which is what makes it worth having -
# TLT is declared `bond_etf` today because inference once called
# it a stock, and nothing but a check like this catches the next
# one (docs/EVALUATION_ASSET_CLASSIFICATION.md §5 C2).
#
# `vendor_type = "Currency"` is NOT a confirmation of crypto:
# the .CC and .FOREX namespaces both serve it, so the row is
# recorded for provenance and the comparison returns
# `not_comparable` (jef.data.classification).

