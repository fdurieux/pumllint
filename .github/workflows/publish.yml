name: publish

# Publishes to PyPI on every release tag (the release ritual already pushes
# one), or on demand via workflow_dispatch for a first/recovery publish.
# Uses PyPI Trusted Publishing (OIDC) — there is no API token to store or
# rotate; PyPI trusts this repo+workflow+environment combination directly.
# One-time setup on the PyPI side: add a (pending) publisher for project
# "pumllint" with owner fdurieux, repository pumllint, workflow publish.yml,
# environment pypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check --strict dist/*

      # Install the wheel into a clean venv and run it from OUTSIDE the
      # checkout: the rules catalog and JSON schemas must come from the
      # wheel's package data, not the source tree — this is exactly what a
      # `pip install pumllint` user gets.
      - name: Smoke-test the wheel away from the source tree
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
          cp examples/order_payment_codegen_good.puml "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          smoke/bin/pumllint --version
          smoke/bin/pumllint schema lint > /dev/null
          smoke/bin/pumllint schema score > /dev/null
          smoke/bin/pumllint order_payment_codegen_good.puml
          smoke/bin/pumllint score order_payment_codegen_good.puml --min-level 2

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pumllint
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      # SHA-pinned: this step holds the OIDC identity that can publish
      # pumllint — a moving ref here would make that identity only as safe
      # as the upstream repo. Dependabot keeps the pin fresh.
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
