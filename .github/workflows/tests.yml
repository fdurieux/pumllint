name: tests

on:
  push:
  pull_request:

# Least-privilege GITHUB_TOKEN regardless of the repository default:
# every job here only reads the checkout and runs tests.
permissions:
  contents: read

jobs:
  # Proves the zero-dependency promise: the core suite runs with nothing but
  # the standard library — no pip install at all.
  zero-dep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run zero-dependency test runner
        run: python tests/run_tests.py

  # Full suite: unit tests plus the executable RULES.md spec (pytest-bdd).
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with test extra
        run: pip install -e ".[test]"
      - name: Verify features are in sync with RULES.md
        run: |
          python tools/extract_features.py
          git diff --exit-code tests/bdd/features/ \
            || (echo "::error::tests/bdd/features is stale — run: python tools/extract_features.py"; exit 1)
      - name: Run full test suite
        run: python -m pytest

  # Windows is where the shell stops expanding wildcards and stdout stops
  # being UTF-8 — neither reproduces on Ubuntu, and both reached a user.
  # The Linux suite simulates them (literal argv, PYTHONIOENCODING=cp1252);
  # only this job proves PowerShell itself.
  #
  # Every pwsh step ends with `$global:LASTEXITCODE = 0`: the runner appends
  # `if (Test-Path variable:\LASTEXITCODE) { exit $LASTEXITCODE }` to the
  # script, so a step whose last native call deliberately exited non-zero
  # would fail even after its assertions passed.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the zero-dependency suite on Windows paths
        run: python tests/run_tests.py
      - name: Install pumllint
        run: pip install -e .
      # PowerShell hands native programs the literal '*.puml'; pumllint has
      # to expand it itself or a directory full of diagrams looks empty.
      # Asserted in both directions against purpose-built fixtures, so the
      # step cannot pass by matching nothing.
      - name: Unexpanded wildcard resolves
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wild | Out-Null
          Set-Content -Encoding utf8 wild\clean.puml "@startuml Ok`ntitle Ok`nAlice -> Bob : hi`n@enduml"
          Set-Content -Encoding utf8 wild\broken.puml "@startuml`nalt maybe`nAlice -> Bob : hi`n@enduml"
          Set-Location wild
          $clean = pumllint clean.puml
          if ($LASTEXITCODE -ne 0) { throw "control: a clean diagram should exit 0, got $LASTEXITCODE" }
          $wild = pumllint *.puml
          if ($LASTEXITCODE -ne 1) { throw "wildcard should have found broken.puml and exited 1, got $LASTEXITCODE ($wild)" }
          if ("$wild" -notmatch 'broken\.puml') { throw "wildcard did not reach broken.puml: $wild" }
          $global:LASTEXITCODE = 0
      - name: A wildcard matching nothing is an error, never a silent pass
        shell: pwsh
        run: |
          $out = pumllint *.nosuchext 2>&1
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2, got $LASTEXITCODE" }
          if ("$out" -notmatch 'no files match pattern') { throw "unexpected message: $out" }
          $global:LASTEXITCODE = 0
      # Redirecting switches stdout off the console codec and onto the ANSI
      # code page, where the report's glyphs used to raise UnicodeEncodeError.
      - name: Redirected output survives the ANSI code page
        shell: pwsh
        run: |
          pumllint examples\credit_intake_good.puml > report.txt
          if ($LASTEXITCODE -ne 0) { throw "redirect run exited $LASTEXITCODE" }
          if ((Get-Item report.txt).Length -eq 0) { throw "redirected report is empty" }
          if (Select-String -Path report.txt -Pattern 'Traceback' -Quiet) { throw "traceback in report" }
          $global:LASTEXITCODE = 0
      # PowerShell 5.1's Out-File writes UTF-16; Set-Content writes ANSI.
      - name: UTF-16 diagrams lint, ANSI diagrams fail by name
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          $src = "@startuml Order`ntitle Order intake`nAlice -> Bob : hi`n@enduml"
          $src | Out-File -Encoding unicode tmp\utf16.puml
          pumllint tmp\utf16.puml
          if ($LASTEXITCODE -ne 0) { throw "UTF-16 diagram did not lint: $LASTEXITCODE" }
          [IO.File]::WriteAllText("$PWD\tmp\ansi.puml", "@startuml`nAlice -> B" + [char]0xF8 + "b : hi`n@enduml`n", [Text.Encoding]::GetEncoding(1252))
          $err = pumllint tmp\ansi.puml 2>&1
          if ($LASTEXITCODE -ne 2) { throw "ANSI diagram should fail with 2, got $LASTEXITCODE" }
          if ("$err" -notmatch 'ansi\.puml') { throw "error did not name the file: $err" }
          $global:LASTEXITCODE = 0
      # apply_fixes joins with the file's own newline; the write must not
      # re-translate it. Line endings are authored here rather than taken
      # from the checkout, whose .puml endings depend on git config.
      - name: fix rewrites files without changing their line endings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          $body = "@startuml`r`nparticipant Customer`r`nCustomer -> engine : go`r`n@enduml`r`n"
          [IO.File]::WriteAllText("$PWD\tmp\crlf.puml", $body, (New-Object Text.UTF8Encoding $false))
          $before = [IO.File]::ReadAllBytes("$PWD\tmp\crlf.puml")
          $beforeLf = ($before | Where-Object { $_ -eq 10 }).Count
          pumllint fix tmp\crlf.puml > fix.log
          if ($LASTEXITCODE -ne 0) { throw "fix exited $LASTEXITCODE" }
          $after = [IO.File]::ReadAllBytes("$PWD\tmp\crlf.puml")
          if ($after.Length -le $before.Length) { throw "fix did not add the expected lines" }
          $cr = ($after | Where-Object { $_ -eq 13 }).Count
          $lf = ($after | Where-Object { $_ -eq 10 }).Count
          if ($cr -ne $lf) { throw "CRLF file no longer has one CR per LF: CR=$cr LF=$lf" }
          if ($lf -le $beforeLf) { throw "line count did not grow: before=$beforeLf after=$lf" }
          for ($i = 0; $i -lt $after.Length - 1; $i++) {
            if ($after[$i] -eq 13 -and $after[$i + 1] -eq 13) { throw "fix produced a doubled CR" }
          }
          $global:LASTEXITCODE = 0

  # Dogfood the composite action (action.yml) against the bundled examples.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint a clean example via the action
        uses: ./
        with:
          paths: examples/order_payment_codegen_good.puml
      - name: Score gate via the action
        uses: ./
        with:
          command: score
          paths: examples
          min-level: "2"

  # Dogfood the pre-commit hooks (.pre-commit-hooks.yaml).
  pre-commit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      # Run from a scratch repo, like a real consumer: keeps the repo-local
      # pumllint.toml config out of the hooks' auto-detection.
      - name: Run both hooks as a user repo would
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"
          cp "$SRC/examples/order_payment_codegen_good.puml" "$TMP/"
          cd "$TMP"
          git init -q
          git add .
          git -c user.email=ci@example.invalid -c user.name=ci commit -qm init
          pre-commit try-repo "$SRC" pumllint \
            --files order_payment_codegen_good.puml --verbose
          pre-commit try-repo "$SRC" pumllint-score \
            --files order_payment_codegen_good.puml --verbose

  # DIM-SYN in anger: the C2 gate (`score --check-syntax`) against real
  # PlantUML over every shipped diagram. Pins both directions — every
  # shipped diagram must pass `-checkonly` (measured: PlantUML tolerates
  # even the bad examples' unclosed alt/while; SEQ004/ACT004 are stricter
  # than the grammar), and a synthetic grammar-broken probe must fail it
  # AND be forced to Level 1 by the cap — so the integration cannot rot
  # toward all-pass or all-fail unnoticed. The only job that needs Java;
  # the linter itself never does.
  syntax-gate:
    runs-on: ubuntu-latest
    env:
      PLANTUML_VERSION: "1.2026.6"
      # sha256 of the release asset above — release assets are mutable, the
      # pin is not. Recompute when bumping PLANTUML_VERSION:
      #   curl -fsSL <url> | sha256sum
      PLANTUML_SHA256: "89948f14c93756c7a3fb7b69078ff37e8489fd79dd430c582b931e2f65358690"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pumllint
        run: pip install -e .
      - name: Install pinned PlantUML
        run: |
          curl -fsSL -o "$RUNNER_TEMP/plantuml.jar" \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          echo "${PLANTUML_SHA256}  $RUNNER_TEMP/plantuml.jar" | sha256sum -c -
          printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/plantuml.jar" \
            | sudo tee /usr/local/bin/plantuml >/dev/null
          sudo chmod +x /usr/local/bin/plantuml
          plantuml -version | head -1
      - name: Score every shipped diagram through the syntax gate
        run: pumllint score examples docs --check-syntax -f json -o syntax-report.json
      - name: Assert every shipped diagram is grammar-valid
        run: |
          python - <<'EOF'
          import json, sys

          # Measured on the first run of this job: PlantUML accepts even the
          # deliberately-bad examples (it tolerates unclosed alt/while — the
          # linter's SEQ004/ACT004 are stricter than the grammar), so the
          # whole shipped set must pass. The failure direction is pinned by
          # the synthetic probe step below.
          report = json.load(open("syntax-report.json"))
          problems = []
          for d in report["diagrams"]:
              ok = d["maturity"]["syntaxOk"]
              print(f"{'PASS' if ok else 'FAIL':4} L{d['maturity']['level']}  {d['file']}")
              if not ok:
                  problems.append(f"{d['file']}: PlantUML rejected a diagram shipped as grammar-valid")
          if len(report["diagrams"]) < 15:
              problems.append(f"only {len(report['diagrams'])} diagrams swept — shipped set shrank?")
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          EOF
      - name: Probe the failure direction (broken grammar must trip C2)
        run: |
          # Diagnostic matrix first: candidate breakages and their raw
          # -checkonly exit codes, so a future PlantUML that swallows the
          # chosen probe is easy to re-pin.
          for c in 'Alice ->' '!undefined_function()' 'class {' ; do
            printf '@startuml\n%s\n@enduml\n' "$c" > "$RUNNER_TEMP/cand.puml"
            plantuml -checkonly "$RUNNER_TEMP/cand.puml" >/dev/null 2>&1 \
              && echo "candidate '$c': exit 0 (accepted)" \
              || echo "candidate '$c': rejected"
          done
          # Chosen probe: 'class {' — a structural parser error. (Measured:
          # PlantUML even accepts a dangling 'Alice ->', so the matrix above
          # documents which breakages the grammar actually rejects.)
          printf '@startuml\nclass {\n@enduml\n' > "$RUNNER_TEMP/broken-probe.puml"
          pumllint score "$RUNNER_TEMP/broken-probe.puml" --check-syntax -f json -o probe.json
          python - <<'EOF'
          import json, sys
          d = json.load(open("probe.json"))["diagrams"][0]
          ok, level = d["maturity"]["syntaxOk"], d["maturity"]["level"]
          print(f"probe: syntaxOk={ok} level={level}")
          if ok:
              print("::error::probe: PlantUML accepted a deliberately broken file — the gate cannot detect failures")
              sys.exit(1)
          if level != 1:
              print(f"::error::probe: syntax failed but level is {level} — C2 did not force Level 1")
              sys.exit(1)
          EOF
