name: tests

on:
  push:
  pull_request:

jobs:
  # Proves the zero-dependency promise: the core suite runs with nothing but
  # the standard library — no pip install at all.
  zero-dep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run zero-dependency test runner
        run: python tests/run_tests.py

  # Full suite: unit tests plus the executable RULES.md spec (pytest-bdd).
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with test extra
        run: pip install -e ".[test]"
      - name: Verify features are in sync with RULES.md
        run: |
          python tools/extract_features.py
          git diff --exit-code tests/bdd/features/ \
            || (echo "::error::tests/bdd/features is stale — run: python tools/extract_features.py"; exit 1)
      - name: Run full test suite
        run: python -m pytest

  # Dogfood the composite action (action.yml) against the bundled examples.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint a clean example via the action
        uses: ./
        with:
          paths: examples/order_payment_codegen_good.puml
      - name: Score gate via the action
        uses: ./
        with:
          command: score
          paths: examples
          min-level: "2"

  # Dogfood the pre-commit hooks (.pre-commit-hooks.yaml).
  pre-commit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      # Run from a scratch repo, like a real consumer: keeps the repo-local
      # pumllint.toml config out of the hooks' auto-detection.
      - name: Run both hooks as a user repo would
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"
          cp "$SRC/examples/order_payment_codegen_good.puml" "$TMP/"
          cd "$TMP"
          git init -q
          git add .
          git -c user.email=ci@example.invalid -c user.name=ci commit -qm init
          pre-commit try-repo "$SRC" pumllint \
            --files order_payment_codegen_good.puml --verbose
          pre-commit try-repo "$SRC" pumllint-score \
            --files order_payment_codegen_good.puml --verbose
