name: kg-demo

# The governed-repository demo (kg_experiment/demo/): on a pull request that
# touches the demo or the harness, build the image, start the stack, load one
# scenario deterministically through the app, check its numbers against the
# record, and tear down. On a push to main, also publish the image to
# ghcr.io/fdurieux/pumllint-kg-demo:<short-sha> and :latest, which the
# compose file references so another machine can pull instead of building.

on:
  pull_request:
    paths:
      - "kg_experiment/demo/**"
      - "kg_experiment/harness/**"
      - "kg_experiment/kit/**"
      - ".github/workflows/kg-demo.yml"
  push:
    branches: [main]
    paths:
      - "kg_experiment/demo/**"
      - "kg_experiment/harness/**"
      - "kg_experiment/kit/**"
      - ".github/workflows/kg-demo.yml"

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kg_experiment/demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: The report endpoint answers and sees the store
        run: |
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/api/scenarios > scenarios.json
          python3 - <<'PY'
          import json
          j = json.load(open("scenarios.json"))
          assert [s["id"] for s in j["scenarios"]] == ["S1", "S2", "S3", "S4", "S5", "S6", "S7"], j["scenarios"]
          assert j["store"]["reachable"], j["store"]
          assert j["deterministic_enabled"] and not j["arms_enabled"], j
          print("menu:", len(j["scenarios"]), "scenarios; store", j["store"]["uri"], "reachable")
          PY
          curl -fsS "localhost:8080/api/results/S6" | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["gate"]["verdict"]=="PROCEED" and len(v["stage2"]["invalidated"])==4 and v["cascade"]["G"].startswith("<svg"); print("replay S6 ok:", v["source"])'
          curl -fsS "localhost:8080/api/register" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["summary"]["nodes"]==27 and r["summary"]["links"]==28 and r["coverage"]["C1"]["excepted"]==1 and r["source"]["digest_ok"] and r["pinned"], r["summary"]; print("register:", r["summary"], "at", r["run_date"])'
          curl -fsS "localhost:8080/api/register/impact/APP-0002" | python3 -c 'import json,sys; w=json.load(sys.stdin); assert "PRD-0002" in w["reached"]["products"] and "JRN-0002" in w["reached"]["journeys"], w["reached"]; print("impact APP-0002:", len(w["edges"]), "edges")'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/register/impact/APP-9999)" = "404"
          curl -fsS "localhost:8080/api/register/footprint/S2" | python3 -c 'import json,sys; f=json.load(sys.stdin); assert f["uncited"]>=1 and "QuoteAPI|on_screening_outage" in f["keys_below"] and f["box"]["colour"]=="bad", f["box"]; print("footprint S2:", f["box"]["lines"])'
          curl -fsS "localhost:8080/api/register/ref/req/REQ-06?scenario=S2" | python3 -c 'import json,sys; r=json.load(sys.stdin); h=[s["heading"] for s in r["panel"]["sections"]]; assert "Links citing it: 0" in h and "Rule hits in S2: 2" in h, h; print("ref REQ-06:", h)'
          curl -fsS "localhost:8080/api/register/ref/link/REL-08002" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["panel"]["title"].startswith("REL-08002"), r["panel"]["title"]; print("ref link:", r["panel"]["title"])'
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/api/register/ref/link/REL-99999")" = "404"

      - name: Load one scenario deterministically through the app
        run: |
          curl -fsS -X POST localhost:8080/api/run -H 'Content-Type: application/json' -d '{"scenario":"S1","mode":"deterministic"}' > run.json
          python3 -c 'import json; print(json.load(open("run.json"))["cmd"])'
          for i in $(seq 1 90); do
            status=$(curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" != "running" ] && break
            sleep 2
          done
          curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["log_text"]); assert r["status"]=="done", r["status"]; open("run_id","w").write(r["id"])'

      - name: Project the register into the store beside the run, and read the census
        run: |
          curl -fsS -X POST localhost:8080/api/register/project -H 'Content-Type: application/json' -d '{}' | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["nodes"]==27 and c["links"]==28 and c["tag"]=="v0.1.0" and c["relationships"]==c["counts"]["relationships"] and c["relationships"]>=150, c; print("projection:", c["by_label"], c["relationships"], "relationships at", c["tag"])'
          curl -fsS localhost:8080/api/scenarios | python3 -c 'import json,sys; j=json.load(sys.stdin); s=j["store"]; assert s["register"] and s["register"]["tag"]=="v0.1.0" and s["loaded"]=="S1", s; print("store:", s["loaded"], "and the register at", s["register"]["tag"])'

      - name: Its numbers match the record
        run: |
          docker compose exec -T app python kg_experiment/demo/tools/compare_deterministic.py "kg_experiment/results/demo-runs/$(cat run_id)"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: kg_experiment/demo/Dockerfile
          push: true
          tags: |
            ghcr.io/fdurieux/pumllint-kg-demo:${{ steps.sha.outputs.short }}
            ghcr.io/fdurieux/pumllint-kg-demo:latest
          labels: |
            org.opencontainers.image.source=https://github.com/fdurieux/pumllint
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=The Neo4j governed-repository demo of kg_experiment (pumllint)
