# Rule metadata catalog.
#
# Declarative half of every registered rule: name, description, severity, scope
# (applies_to), maturity dimension and profile gating. The imperative half — the
# check() algorithm — stays in Python. `@register` (see rules/__init__.py) stamps
# these fields onto each rule class by matching its `id`; every registered rule
# MUST have an entry here, and tests/test_catalog.py guards catalog<->registry
# parity.
#
# `severity` values map 1:1 onto pumllint.model.Severity
# (info | minor | major | critical | blocker). `dimension` values map 1:1 onto
# pumllint.model.Dimension (DIM-SEM | DIM-CMP | DIM-CON | DIM-TRC | DIM-RDB |
# DIM-AMB; DIM-SYN is the external gate and is never carried by a rule) and feed
# the maturity scorer (see SCORING.md). `profiles = []` means the base catalog
# (always active); a non-empty list gates the rule behind a profile.

# --- GEN: cross-cutting governance -----------------------------------------

