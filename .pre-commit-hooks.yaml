# pre-commit hooks (https://pre-commit.com). Usage in .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/fdurieux/pumllint
#       rev: v0.8.0
#       hooks:
#         - id: pumllint
#         - id: pumllint-score
#           args: [--min-level, "3"]
#
# Both hooks receive the staged PlantUML files as arguments. `pumllint-score`
# is a no-op gate without args — give it --min-level N and/or
# --baseline FILE to make it fail commits. Never --update-baseline here: it
# accepts every staged regression and gates nothing.
#
# Hook environments are isolated: if your repo uses a pumllint.yaml config,
# add `additional_dependencies: [PyYAML]` to the hook (toml/json configs
# need nothing extra).
- id: pumllint
  name: pumllint
  description: Semantic lint for PlantUML diagrams (fails on findings >= --fail-on, default major)
  entry: pumllint
  language: python
  files: \.(puml|plantuml|iuml|wsd)$
- id: pumllint-score
  name: pumllint score
  description: Maturity gate for PlantUML diagrams (pass --min-level N or --baseline FILE via args)
  entry: pumllint score
  language: python
  files: \.(puml|plantuml|iuml|wsd)$
