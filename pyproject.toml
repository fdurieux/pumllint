[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pumllint"
version = "0.31.0"
description = "Semantic linter and maturity scorer for PlantUML diagrams, with SonarQube export"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "fdurieux", email = "fdurieux@i-kei.com" }]
keywords = [
    "plantuml",
    "uml",
    "linter",
    "lint",
    "static-analysis",
    "diagrams",
    "architecture",
    "maturity-model",
    "sonarqube",
    "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=7", "pytest-bdd>=7"]

[project.scripts]
pumllint = "pumllint.cli:main"

[project.urls]
Homepage = "https://github.com/fdurieux/pumllint"
Documentation = "https://github.com/fdurieux/pumllint/tree/main/docs"
Changelog = "https://github.com/fdurieux/pumllint/releases"
Issues = "https://github.com/fdurieux/pumllint/issues"
"Live example report" = "https://fdurieux.github.io/pumllint/example-maturity-report.html"

[tool.setuptools.packages.find]
include = ["pumllint*"]

[tool.setuptools.package-data]
pumllint = ["rules/catalog.toml", "schemas/*.schema.json"]
