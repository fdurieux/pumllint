[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pumllint"
version = "0.9.0"
description = "Semantic linter for PlantUML diagrams with SonarQube export"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=7", "pytest-bdd>=7"]

[project.scripts]
pumllint = "pumllint.cli:main"

[tool.setuptools.packages.find]
include = ["pumllint*"]

[tool.setuptools.package-data]
pumllint = ["rules/catalog.toml"]
