[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pumllint"
version = "0.34.0"
description = "Semantic linter and maturity scorer for PlantUML diagrams, with SonarQube export"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "fdurieux", email = "fdurieux@i-kei.com" }]
keywords = [
    "plantuml",
    "uml",
    "linter",
    "lint",
    "static-analysis",
    "diagrams",
    "architecture",
    "maturity-model",
    "sonarqube",
    "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
# pytest 9.2.0 (2026-10-27) removed FixtureManager._arg2fixturedefs, which
# pytest-bdd 9.0.0 still calls; lift the cap once pytest-bdd supports it.
test = ["pytest>=7,<9.3", "pytest-bdd>=7"]

[project.scripts]
pumllint = "pumllint.cli:main"

[project.urls]
Homepage = "https://github.com/fdurieux/pumllint"
Documentation = "https://github.com/fdurieux/pumllint/tree/main/docs"
Changelog = "https://github.com/fdurieux/pumllint/releases"
Issues = "https://github.com/fdurieux/pumllint/issues"
"Live example report" = "https://fdurieux.github.io/pumllint/example-maturity-report.html"

[tool.setuptools.packages.find]
include = ["pumllint*"]

[tool.setuptools.package-data]
pumllint = ["rules/catalog.toml", "schemas/*.schema.json"]

[tool.pytest.ini_options]
# The lab directories (stack_experiment/, c4_experiment/, recreate_experiment/)
# carry their own pytest suites, which run against their own subjects, never
# against this package: collect only this repository's tests.
testpaths = ["tests"]
